<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#8a4d46">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <title>Tarot de Delphes</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <img class="brand-mark-topbar" src="assets/logo-mark.png" alt="" aria-hidden="true">
      <div>
        <div class="eyebrow">TAROT DE DELPHES · MYTHOLOGIE GRECQUE</div>
        <h1 id="pageTitle">Tarot de Delphes</h1>
      </div>
      <button class="icon-btn" id="accountMenuBtn" aria-label="Compte">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.2" r="3.6"></circle><path d="M4.8 19.5c0-3.9 3.2-7 7.2-7s7.2 3.1 7.2 7"></path></svg>
      </button>
    </header>
    <main id="screen"></main>
    <nav class="bottom-nav">
      <button data-route="home" class="active"><span>⌂</span>Accueil</button>
      <button data-route="tirage"><span>✦</span>Tirage</button>
      <button data-route="apprendre"><span>◈</span>Apprendre</button>
      <button data-route="reves"><span>☾</span>Rêves</button>
      <button data-route="profil"><span>☉</span>Astro</button>
    </nav>
    <button class="sound-toggle" id="soundBtn" aria-label="Activer le son d'ambiance" aria-pressed="false">🔈</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
